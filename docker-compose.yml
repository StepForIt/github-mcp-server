services:
  github-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    command: ["http", "--base-url", "https://githubmcp.srv715024.hstgr.cloud"]
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
    restart: unless-stopped
